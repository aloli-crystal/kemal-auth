name: kemal-auth
version: 0.1.0
description: |
  Authentication library for Kemal web applications.
  Provides password management (BCrypt with CNIL-compliant rules),
  JWT tokens, session management (Kemal cookies), user invitations,
  and password reset via configurable SMTP.

authors:
  - Philippe Nénert <philippe@aloli.fr>

crystal: ">= 1.18.1"

license: MIT

dependencies:
  bcrypt:
    github: jgaskins/bcrypt
  email:
    github: arcage/crystal-email
    version: "~> 0.6"
  jwt:
    github: crystal-community/jwt
    version: "~> 1.6"
